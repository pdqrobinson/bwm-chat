name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: PHP syntax
        run: php -l bwm-client-chat.php
      - name: JavaScript syntax
        run: node --check assets/chat.js
